<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1288" width="600" height="1288" role="img" aria-labelledby="t d"><title id="t">Como o mapa é feito</title><desc id="d">As fontes são lidas cada uma por si: do Claude Code, o registro de sessões, as conversas e os ajudantes; do Codex, os rollouts, os nomes das conversas e os processos; depois o ambiente dos processos, o Tern e os orquestradores. Uma regra de cores dá um estado a cada cartão, e o resultado sai como snapshot (/state) e é desenhado pela página.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@keyframes f0{0%,0%{stroke-dashoffset:3}40%,100%{stroke-dashoffset:-103}}.f0{animation:f0 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f1{0%,48%{stroke-dashoffset:3}88%,100%{stroke-dashoffset:-103}}.f1{animation:f1 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f2{0%,34%{opacity:0}42%{opacity:1}56%,100%{opacity:0}}.f2{opacity:0;animation:f2 6s cubic-bezier(.23,1,.32,1) infinite}@keyframes spin{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.spin{animation:spin 3s linear infinite}@keyframes spint{from{stroke-dashoffset:130}to{stroke-dashoffset:30}}.spint{animation:spint 3s linear infinite}@keyframes spinh{from{stroke-dashoffset:86}to{stroke-dashoffset:-14}}.spinh{animation:spinh 3s linear infinite}.ph1{animation-delay:-1.1s}.ph2{animation-delay:-2.2s}.phn1{animation-delay:-.2s}.phn2{animation-delay:-.4s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#0f0f1117"/></pattern><radialGradient id="ga"><stop offset="0" stop-color="#7a1c3e12"/><stop offset=".7" stop-color="#7a1c3e00"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#242e5614"/><stop offset=".7" stop-color="#242e5600"/></radialGradient><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="panel"><rect width="600" height="1288" rx="22"/></clipPath></defs><g clip-path="url(#panel)"><rect width="600" height="1288" fill="#f6f6f8"/><ellipse cx="120" cy="322" rx="330" ry="644" fill="url(#ga)"/><ellipse cx="450" cy="1030.4" rx="360" ry="772.8" fill="url(#gb)"/><rect width="600" height="1288" fill="url(#dots)"/></g><rect x=".75" y=".75" width="598.5" height="1286.5" rx="21.25" fill="none" stroke="#d8d8de" stroke-width="1.5"/><path d="M300,774 C300,808 300,808 300,842" fill="none" stroke="#868994" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/><path d="M300,1068 C300,1112 156,1112 156,1156" fill="none" stroke="#868994" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/><path d="M300,1068 C300,1112 444,1112 444,1156" fill="none" stroke="#868994" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/><text x="24" y="56" font-size="22" font-weight="700" fill="#6e6f77" data-free="1">fontes</text><rect x="24" y="82" width="552" height="236" rx="16" fill="none" stroke="#d8d8de" stroke-width="2"/><text x="40" y="116" font-size="22" font-weight="700" fill="#55565e" data-box="40,82,520,48">Claude Code</text><rect x="40" y="130" width="520" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="58" y="164" font-size="22" fill="#16161a" data-box="58,130,484,52">registro de sessões</text><rect x="40" y="192" width="520" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="58" y="226" font-size="22" fill="#16161a" data-box="58,192,484,52">conversas</text><rect x="40" y="254" width="520" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="58" y="288" font-size="22" fill="#16161a" data-box="58,254,484,52">ajudantes</text><rect x="24" y="334" width="552" height="236" rx="16" fill="none" stroke="#d8d8de" stroke-width="2"/><text x="40" y="368" font-size="22" font-weight="700" fill="#55565e" data-box="40,334,520,48">Codex</text><rect x="40" y="382" width="520" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="58" y="416" font-size="22" fill="#16161a" data-box="58,382,484,52">rollouts</text><rect x="40" y="444" width="520" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="58" y="478" font-size="22" fill="#16161a" data-box="58,444,484,52">nomes das conversas</text><rect x="40" y="506" width="520" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="58" y="540" font-size="22" fill="#16161a" data-box="58,506,484,52">processos</text><rect x="24" y="586" width="552" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="42" y="620" font-size="22" fill="#16161a" data-box="42,586,516,52">ambiente dos processos</text><rect x="24" y="648" width="552" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="42" y="682" font-size="22" fill="#16161a" data-box="42,648,516,52">Tern</text><rect x="24" y="710" width="552" height="52" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><text x="42" y="744" font-size="22" fill="#16161a" data-box="42,710,516,52">orquestradores</text><rect x="12" y="70" width="576" height="704" rx="20" fill="none" stroke="#86899466" stroke-width="2" stroke-dasharray="8 8"/><text x="24" y="824" font-size="22" font-weight="700" fill="#6e6f77" data-free="1">regra</text><rect x="24" y="842" width="552" height="226" rx="18" fill="#ffffff" stroke="#d8d8de" stroke-width="2"/><path d="M25,906 V860 A17,17 0 0 1 42,843 H558 A17,17 0 0 1 575,860 V906 Z" fill="#f8f8fa"/><line x1="26" y1="906" x2="574" y2="906" stroke="#0f0f1114" stroke-width="1"/><text x="44" y="884" font-size="26" font-weight="700" fill="#16161a" data-box="44,842,512,64">uma regra de cores</text><rect x="45" y="936" width="16" height="16" rx="4" fill=