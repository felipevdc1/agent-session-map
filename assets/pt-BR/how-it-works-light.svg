<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d"><title id="t">Como o mapa é feito</title><desc id="d">Seis fontes são lidas cada uma por si: o registro de sessões, as conversas, os ajudantes, o ambiente dos processos, o Tern e os orquestradores. Uma regra de cores dá um estado a cada cartão, e o resultado sai como snapshot (/state) e é desenhado pela página.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@keyframes f0{0%,0%{stroke-dashoffset:3}40%,100%{stroke-dashoffset:-103}}.f0{animation:f0 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f1{0%,48%{stroke-dashoffset:3}88%,100%{stroke-dashoffset:-103}}.f1{animation:f1 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f2{0%,34%{opacity:0}42%{opacity:1}56%,100%{opacity:0}}.f2{opacity:0;animation:f2 6s cubic-bezier(.23,1,.32,1) infinite}@keyframes spin{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.spin{animation:spin 3s linear infinite}@keyframes spint{from{stroke-dashoffset:130}to{stroke-dashoffset:30}}.spint{animation:spint 3s linear infinite}@keyframes spinh{from{stroke-dashoffset:86}to{stroke-dashoffset:-14}}.spinh{animation:spinh 3s linear infinite}.ph1{animation-delay:-1.1s}.ph2{animation-delay:-2.2s}.phn1{animation-delay:-.2s}.phn2{animation-delay:-.4s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#0f0f1117"/></pattern><radialGradient id="ga"><stop offset="0" stop-color="#7a1c3e12"/><stop offset=".7" stop-color="#7a1c3e00"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#242e5614"/><stop offset=".7" stop-color="#242e5600"/></radialGradient><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="panel"><rect width="960" height="420" rx="22"/></clipPath></defs><g clip-path="url(#panel)"><rect width="960" height="420" fill="#f6f6f8"/><ellipse cx="192" cy="105" rx="528" ry="210" fill="url(#ga)"/><ellipse cx="720" cy="336" rx="576" ry="252" fill="url(#gb)"/><rect width="960" height="420" fill="url(#dots)"/></g><rect x=".75" y=".75" width="958.5" height="418.5" rx="21.25" fill="none" stroke="#d8d8de" stroke-width="1.5"/><path d="M292,100 C332,100 330,231 370,231" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M292,152 C332,152 330,231 370,231" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M292,204 C332,204 330,231 370,231" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M292,256 C332,256 330,231 370,231" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M292,308 C332,308 330,231 370,231" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M292,360 C332,360 330,231 370,231" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M590,231 C630,231 628,178 668,178" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M590,231 C630,231 628,282 668,282" fill="none" stroke="#868994" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/><text x="32" y="58" font-size="13" font-weight="700" fill="#6e6f77" data-free="1">fontes</text><text x="370" y="58" font-size="13" font-weight="700" fill="#6e6f77" data-free="1">regra</text><text x="668" y="58" font-size="13" font-weight="700" fill="#6e6f77" data-free="1">saídas</text><rect x="32" y="80" width="260" height="40" rx="10" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5