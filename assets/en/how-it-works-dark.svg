<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" width="960" height="588" role="img" aria-labelledby="t d"><title id="t">How the map is made</title><desc id="d">The sources are read on their own: for Claude Code, the session registry, the conversations and the helpers; for Codex, the rollouts, the thread names and the processes; then the process environment, Tern and the orchestrators. One color rule turns them into a state per card, and the result is served as a snapshot (/state) and drawn by the page.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@keyframes f0{0%,0%{stroke-dashoffset:3}40%,100%{stroke-dashoffset:-103}}.f0{animation:f0 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f1{0%,48%{stroke-dashoffset:3}88%,100%{stroke-dashoffset:-103}}.f1{animation:f1 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f2{0%,34%{opacity:0}42%{opacity:1}56%,100%{opacity:0}}.f2{opacity:0;animation:f2 6s cubic-bezier(.23,1,.32,1) infinite}@keyframes spin{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.spin{animation:spin 3s linear infinite}@keyframes spint{from{stroke-dashoffset:130}to{stroke-dashoffset:30}}.spint{animation:spint 3s linear infinite}@keyframes spinh{from{stroke-dashoffset:86}to{stroke-dashoffset:-14}}.spinh{animation:spinh 3s linear infinite}.ph1{animation-delay:-1.1s}.ph2{animation-delay:-2.2s}.phn1{animation-delay:-.2s}.phn2{animation-delay:-.4s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#ffffff1c"/></pattern><radialGradient id="ga"><stop offset="0" stop-color="#7a1c3e33"/><stop offset=".7" stop-color="#7a1c3e00"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#242e564d"/><