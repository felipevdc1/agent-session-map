<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 970" width="600" height="970" role="img" aria-labelledby="t d"><title id="t">How the map is made</title><desc id="d">Six sources are read on their own: the session registry, the conversations, the helpers, the process environment, Tern and the orchestrators. One color rule turns them into a state per card, and the result is served as a snapshot (/state) and drawn by the page.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@keyframes f0{0%,0%{stroke-dashoffset:3}40%,100%{stroke-dashoffset:-103}}.f0{animation:f0 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f1{0%,48%{stroke-dashoffset:3}88%,100%{stroke-dashoffset:-103}}.f1{animation:f1 6s cubic-bezier(.77,0,.175,1) infinite}@keyframes f2{0%,34%{opacity:0}42%{opacity:1}56%,100%{opacity:0}}.f2{opacity:0;animation:f2 6s cubic-bezier(.23,1,.32,1) infinite}@keyframes spin{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.spin{animation:spin 3s linear infinite}@keyframes spint{from{stroke-dashoffset:130}to{stroke-dashoffset:30}}.spint{animation:spint 3s linear infinite}@keyframes spinh{from{stroke-dashoffset:86}to{stroke-dashoffset:-14}}.spinh{animation:spinh 3s linear infinite}.ph1{animation-delay:-1.1s}.ph2{animation-delay:-2.2s}.phn1{animation-delay:-.2s}.phn2{animation-delay:-.4s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#ffffff1c"/></pattern><radialGradient id="ga"><stop offset="0" stop-color="#7a1c3e33"/><stop offset=".7" stop-color="#7a1c3e00"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#242e564d"/><stop offset=".7" stop-color="#242e5600"/></radialGradient><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="panel"><rect width="600" height="970" rx="22"/></clipPath></defs><g clip-path="url(#panel)"><rect width="600" height="970" fill="#0f0f11"/><ellipse cx="120" cy="242.5" rx="330" ry="485" fill="url(#ga)"/><ellipse cx="450" cy="776" rx="360" ry="582" fill="url(#gb)"/><rect width="600" height="970" fill="url(#dots)"/></g><rect x=".75" y=".75" width="598.5" height="968.5" rx="21.25" fill="none" stroke="#2d2e33" stroke-width="1.5"/><path d="M300,456 C300,490 300,490 300,524" fill="none" stroke="#c6c8cf" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/><path d="M300,750 C300,794 156,794 156,838" fill="none" stroke="#c6c8cf" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/><path d="M300,750 C300,794 444,794 444,838" fill="none" stroke="#c6c8cf" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/><text x="24" y="56" font-size="22" font-weight="700" fill="#6c6d75" data-free="1">sources</text><rect x="24" y="82" width="552" height="52" rx="12" fill="#141416" stroke="#2d2e33" stroke-width="2"/><text x="42" y="116" font-size="22" fill="#ececf0" data-box="42,82,516,52">session registry</text><rect x="24" y="144" width="552" height="52" rx="12" fill="#141416" stroke="#2d2e33" stroke-width="2"/><text x="42" y="178" font-size="22" fill="#ececf0" data-box="42,144,516,52">conversations</text><rect x="24" y="206" width="552" height="52" rx="12" fill="#141416" stroke="#2d2e33" stroke-width="2"/><text x="42" y="240" font-size="22" fill="#ececf0" data-box="42,206,516,52">helpers</text><rect x="24" y="268" width="552" height="52" rx="12" fill="#141416" stroke="#2d2e33" stroke-width="2"/><text x="42" y="302" font-size="22" fill="#ececf0" data-box="42,268,516,52">process environment</text><rect x="24" y="330" width="552" height="52" rx="12" fill="#141416" stroke="#2d2e33" stroke-width="2"/><text x="42" y="364" font-size="22" fill="#ececf0" data-box="42,330,516,52">Tern</text><rect x="24" y="392" width="552" height="52" rx="12" fill="#141416" stroke="#2d2e33" stroke-width="2"/><text x="42" y="426" font-size="22" fill="#ececf0" data-box="42,392,516,52">orchestrators</text><rect x="12" y="70" width="576" height="386" rx="20" fill="none" stroke="#c6c8cf52" stroke-width="2" stroke-dasharray="8 8"/><text x="24" y="506" font-size="22" font-weight="700" fill="#6c6d75" data-free="1">rule</text><rect x="24" y="524" width="552" height="226" rx="18" fill="#141416" stroke="#2d2e33" stroke-width="2"/><path d="M25,588 V542 A17,17 0 0 1 42,525 H558 A17,17 0 0 1 575,542 V588 Z" fill="#18181b"/><line x1="26" y1="588" x2="574" y2="588" stroke="#ffffff14" stroke-width="1"/><text x="44" y="566" font-size="26" font-weight="700" fill="#ececf0" data-box="44,524,512,64">one color rule</text><rect x="45" y="618" width="16" height="16" rx="4" fill="none" stroke="#8cc8ff59" stroke-width="4" filter="url(#glow)"/><rect x="45" y="618" width="16" height="16" rx="4" fill="none" stroke="#8cc8ff" stroke-width="2"/><text x="74" y="634" font-size="22" fill="#9b9ca5" data-box="74,612,230,30">working</text><rect x="315" y="618" width="16" height="16" rx="4" fill="none" stroke="#f2c84b" stroke-width="2"/><text x="344" y="634" font-size="22" fill="#9b9ca5" data-box="344,612,230,30">waiting</text><rect x="45" y="662" width="16" height="16" rx="4" fill="none" stroke="#3fd68a" stroke-width="2"/><text x="74" y="678" font-size="22" fill="#9b9ca5" data-box="74,656,230,30">done</text><rect x="315" y="662" width="16" height="16" rx="4" fill="none" stroke="#4c4e55" stroke-width="2"/><text x="344" y="678" font-size="22" fill="#9b9ca5" data-box="344,656,230,30">stopped</text><rect x="45" y="706" width="16" height="16" rx="4" fill="none" stroke="#3fd68a" stroke-width="2" opacity=".6"/><text x="74" y="722" font-size="22" fill="#9b9ca5" data-box="74,700,230,30">closed</text><rect x="315" y="706" width="16" height="16" rx="4" fill="none" stroke="#6c6d75" stroke-width="2" stro