e-dashoffset="-6" class="spinh ph1" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><text x="330" y="883.76" font-size="22" font-weight="700" fill="#ececf0" data-box="330,838,228,52">the page</text><text x="330" y="918.08" font-size="20" class="mono" fill="#9b9ca5" data-box="330,890,228,52">127.0.0.1:9131</text><path d="M300,456 C300,490 300,490 300,524" pathLength="100" stroke-dasharray="1 300" stroke-dashoffset="3" class="f0" fill="none" stroke="#8cc8ff" stroke-width="9" stroke-linecap="round"/><path d="M300,750 C300,794 156,794 156,838" pathLength="100" stroke-dasharray="1 300" stroke-dashoffset="3" class="f1" fill="none" stroke="#8cc8ff" stroke-width="9" stroke-linecap="round"/><path d="M300,750 C300,794 444,794 444,838" pathLength="100" stroke-dasharray="1 300" stroke-dashoffset="3" class="f1" fill="none" stroke="#8cc8ff" stroke-width="9" stroke-linecap="round"/><circle cx="300" cy="456" r="7" fill="#a3a6ae" stroke="#0f0f11" stroke-width="2"/><circle cx="300" cy="524" r="7" fill="#a3a6ae" stroke="#0f0f11" stroke-width="2"/><circle cx="300" cy="750" r="7" fill="#a3a6ae" stroke="#0f0f11" stroke-width="2"/><circle cx="156" cy="838" r="7" fill="#a3a6ae" stroke="#0f0f11" stroke-width="2"/><circle cx="444" cy="838" r="7" fill="#a3a6ae" stroke="#0f0f11" stroke-width="2"/></svg>