<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d"><title id="t">Installing from Claude Code or Codex</title><desc id="d">The install request pasted into Claude Code or Codex, the three things the agent reports back, and the line the open command prints with the map's address.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@keyframes l0{0%,6%{opacity:.3}9%,96%{opacity:1}100%{opacity:.3}}.l0{animation:l0 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l1{0%,16%{opacity:.3}19%,96%{opacity:1}100%{opacity:.3}}.l1{animation:l1 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l2{0%,26%{opacity:.3}29%,96%{opacity:1}100%{opacity:.3}}.l2{animation:l2 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l3{0%,36%{opacity:.3}39%,96%{opacity:1}100%{opacity:.3}}.l3{animation:l3 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l4{0%,46%{opacity:.3}49%,96%{opacity:1}100%{opacity:.3}}.l4{animation:l4 10s cubic-bezier(.23,1,.32,1) infinite}@keyframes l5{0%,56%{opacity:.3}59%,96%{opacity:1}100%{opacity:.3}}.l5{animation:l5 10s cubic-bezier(.23,1,.32,1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#0f0f1117"/></pattern><radialGradient id="ga"><stop offset="0" stop-color="#7a1c3e12"/><stop offset=".7" stop-color="#7a1c3e00"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#242e5614"/><stop offset=".7" stop-color="#242e5600"/></radialGradient><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="panel"><rect width="760" height="600" rx="22"/></clipPath></defs><g clip-path="url(#panel)"><rect width="760" height="600" fill="#f6f6f8"/><ellipse cx="152" cy="150" rx="418" ry="300" fill="url(#ga)"/><ellipse cx="570" cy="480" rx="456" ry="360" fill="url(#gb)"/><rect width="760" height="600" fill="url(#dots)"/></g><rect x=".75" y=".75" width="758.5" height="598.5" rx="21.25" fill="none" stroke="#d8d8de" stroke-width="1.5"/><text x="40" y="58" font-size="18" font-weight="700" class="mono" fill="#55565e" data-free="1">INSTALL</text><text x="40" y="104" font-size="34" font-weight="800" fill="#16161a" data-free="1">One request. The map opens.</text><rect x="24" y="132" width="712" height="440" rx="14" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/><path d="M24.75,176 V146 A13.25,13.25 0 0 1 38,132.75 H722 A13.25,13.25 0 0 1 735.25,146 V176 Z" fill="#f8f8fa"/><line x1="25.5" y1="176" x2="734.5" y2="176" stroke="#0f0f1114" stroke-width="1"/><circle cx="48" cy="154" r="6" fill="#d8d8de"/><circle cx="68" cy="154" r="6" fill="#d8d8de"/><circle cx="88" cy="154" r="6" fill="#d8d8de"/><text x="380" y="160" font-size="18" text-anchor="middle" class="mono" fill="#55565e" data-free="1">Claude Code or Codex</text><g class="l0"><text x="44" y="222" font-size="18" font-weight="700" class="mono" fill="#6e6f77" data-box="44,204,22,26">❯</text><text x="72" y="222" font-size="18" class="mono" fill="#16161a" data-box="72,204,648,26">Install agent-session-map from</text><text x="72" y="250" font-size="18" class="mono" fill="#16161a" data-box="72,232,648,26">https://github.com/felipevdc1/agent-session-map.</text><text x="72" y="278" font-size="18" class="mono" fill="#16161a" data-box="72,260,648,26">Clone it…</text></g><g class="l1"><text x="44" y="326" font-size="18" font-weight="700" class="mono" fill="#168a54" data-box="44,308,22,26">✓</text><text x="72" y="326" font-size="18" class="mono" fill="#16161a" data-box="72,308,648,26">Cloned agent-session-map into the folder you chose</text></g><g class="l2"><text x="44" y="360" font-size="18" font-weight="700" class="mono" fill="#168a54" data-box="44,342,22,26">✓</text><text x="72" y="360" font-size="18" class="mono" fill="#16161a" data-box="72,342,648,26">python3 is 3.11, and 3.9 or newer is needed</text></g><g class="l3"><text x="44" y="394" font-size="18" font-weight="700" class="mono" fill="#168a54" data-box="44,376,22,26">✓</text><text x="72" y="394" font-size="18" class="mono" fill="#16161a" data-box="72,376,648,26">Ran python3 -m session_map open from the clone</text></g><g class="l4"><rect x="58" y="418" width="670" height="84" rx="10" fill="#f8f8fa" stroke="#0f0f1114" stroke-width="1"/><text x="72" y="452" font-size="18" class="mono" fill="#6e6f77" data-box="72,418,648,40">$ python3 -m session_map open</text><text x="72" y="486" font-size="18" class="mono" fill="#16161a" data-box="72,460,648,40">Map opened in the default browser: http://127.0.0.1:9131/</text></g><g class="l5"><text x="72" y="540" font-size="18" fill="#55565e" data-box="72,522,648,26">Run the same command again to reopen it.</text></g></svg>